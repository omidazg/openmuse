name: android

# Signed production build of the Android app (APK for direct install, AAB for stores).
# Signing key: repository secrets ANDROID_KEYSTORE_BASE64 (PKCS12), ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS; see apps/mobile/plugins/with-release-signing.js.
on:
  workflow_dispatch:
  push:
    branches: [fa-arvan]
    paths:
      - apps/mobile/**
      - packages/domain/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://dastyargpt.ai
      # Grows with every run, as Android requires for updates.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # SHA-256 of the upload certificate; the build fails if the APK is signed with anything else.
      EXPECTED_CERT_SHA256: 6132d8f96622648682256584b745e83eff74a29b8095ff2bd65b9e6e654fe906
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build signed APK and AAB
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DASTYAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DASTYAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          export DASTYAR_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$DASTYAR_KEYSTORE_FILE"
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          rm -f "$DASTYAR_KEYSTORE_FILE"
      - name: Verify signature and collect files
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          aab=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $digest, expected $EXPECTED_CERT_SHA256"; exit 1
          fi
          version=$(node -p "require('./apps/mobile/package.json').version")
          mkdir -p out
          cp "$apk" "out/dastyargpt-$version-$ANDROID_VERSION_CODE.apk"
          cp "$aab" "out/dastyargpt-$version-$ANDROID_VERSION_CODE.aab"
          ls -la out
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dastyargpt-android-${{ github.run_number }}
          path: out/
          retention-days: 30
